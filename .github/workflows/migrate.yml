name: Migrar Almeida e Costa

on:
  push:
    branches: [main]
    paths: ['.github/workflows/migrate.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar versão premium atual
        run: git clone --depth 1 --branch claude/law-firm-demo-site-szl8lc https://github.com/Alexandre802/teste.git /tmp/fonte

      - name: Criar projeto isolado Almeida e Costa
        run: |
          rm -rf app components remotion public package.json package-lock.json next.config.ts tsconfig.json eslint.config.mjs postcss.config.mjs
          mkdir -p app components public
          cp -R /tmp/fonte/app/advocacia-premium ./app/advocacia-premium
          cp -R /tmp/fonte/components/advocacia-premium ./components/advocacia-premium
          cp -R /tmp/fonte/remotion ./remotion
          cp -R /tmp/fonte/public/advocacia-premium ./public/advocacia-premium
          cp /tmp/fonte/tsconfig.json ./tsconfig.json
          cp /tmp/fonte/eslint.config.mjs ./eslint.config.mjs
          if [ -f /tmp/fonte/next.config.ts ]; then cp /tmp/fonte/next.config.ts ./next.config.ts; fi
          cat > app/layout.tsx <<'EOF'
          import type { Metadata } from 'next';
          import './globals.css';

          export const metadata: Metadata = {
            title: 'Almeida & Costa | Advocacia e Consultoria Jurídica',
            description: 'Projeto demonstrativo de advocacia premium criado pela Alexandre Soluções Digitais.',
            robots: { index: false, follow: false },
          };

          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return <html lang="pt-BR"><body>{children}</body></html>;
          }
          EOF
          cat > app/globals.css <<'EOF'
          html, body { margin: 0; padding: 0; min-height: 100%; background: #030405; }
          * { box-sizing: border-box; }
          EOF
          cat > app/page.tsx <<'EOF'
          import { redirect } from 'next/navigation';
          export default function Home() { redirect('/advocacia-premium'); }
          EOF
          cat > package.json <<'EOF'
          {
            "name": "almeida-costa-advocacia",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "dev": "next dev",
              "build": "next build",
              "start": "next start",
              "lint": "eslint .",
              "typecheck": "tsc --noEmit"
            },
            "dependencies": {
              "@remotion/player": "^4.0.0",
              "framer-motion": "^11.15.0",
              "next": "^16.3.2",
              "react": "19.0.0",
              "react-dom": "19.0.0",
              "remotion": "^4.0.0"
            },
            "devDependencies": {
              "@types/node": "^22.10.5",
              "@types/react": "^19.0.7",
              "@types/react-dom": "^19.0.3",
              "eslint": "^9.18.0",
              "eslint-config-next": "^16.3.2",
              "typescript": "^5.7.3"
            }
          }
          EOF
          npm install --package-lock-only --ignore-scripts
          cat > MIGRACAO.md <<'EOF'
          # Almeida & Costa — repositório isolado
          Contém somente o demonstrativo premium de advocacia e seus assets/Remotion. Nenhum código, metadado ou dependência específica do Michel Food House é mantido.
          EOF

      - name: Registrar migração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migra Almeida & Costa sem metadados do Michel" || exit 0
          git push origin main
